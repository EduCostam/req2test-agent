services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: qa_agent
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://qa:qa_local_only@postgres:5432/qa_agent
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgres://qa:qa_local_only@postgres:5432/qa_agent
      HOST: 0.0.0.0
      PORT: 3000
      LLM_PROVIDER: fake
      FAKE_SEED: 10
      LLM_TIMEOUT_MS: 5000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
